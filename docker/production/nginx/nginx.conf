user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access_log main;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

  ssl_certificate /etc/letsencrypt/live/vineetpersonal.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vineetpersonal.site/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

  # This is the public edge: name the host from server_name, not the browser's Host header.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  upstream api {
   server api:8000;
  }

  upstream client {
   server client:3000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name vineetpersonal.site www.vineetpersonal.site;
    return 301 https://$server_name$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name vineetpersonal.site www.vineetpersonal.site;

    client_max_body_size 20M;
    error_log /var/log/nginx/error.log error;

    # Security headers are set once here for every route; Spring's copies are dropped to avoid duplicates.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Framing/base/plugin limits only; a script policy needs testing against Next.js and Vaadin first.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location /api/v1/ {
      proxy_pass http://api;
      access_log /var/log/nginx/api_access.log;
      error_log /var/log/nginx/api_error.log error;
    }

    location /media/ {
      proxy_pass http://api;
    }

    location /admin {
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://api;
    }

    location /admin-assets/ {
      proxy_pass http://api;
    }

    location /VAADIN/ {
      proxy_pass http://api;
    }

    # Old Django admin bookmarks.
    location /supersecret {
      return 308 /admin/;
    }

    # Google sign-in callbacks registered with the original backend's path.
    location /api/v1/auth/google {
      proxy_pass http://client/google;
    }

    location / {
      proxy_pass http://client;
    }

  }

}
