upstream api {
  server api:8000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream client {
  server client:3000;
}

server {
  listen 80;

  client_max_body_size 20M;

  error_log /var/log/nginx/error.log error;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;

  proxy_set_header X-Real-IP $remote_addr;

  # The backend takes the client's address from these headers, so nginx sets them itself rather
  # than passing on whatever the browser sent: sign-in and guest limits are counted per address.
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_http_version 1.1;

  proxy_set_header Upgrade $http_upgrade;

  proxy_set_header Connection $connection_upgrade;

  # Same headers as production, minus HSTS (this listener is plain HTTP on :8080).
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

  location /api/v1/ {
    proxy_pass http://api;
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log error;
  }

  location /media/ {
    proxy_pass http://api;
  }

  location /admin {
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://api;
  }

  location /admin-assets/ {
    proxy_pass http://api;
  }

  location /VAADIN/ {
    proxy_pass http://api;
  }

  # Old Django admin bookmarks.
  location /supersecret {
    return 308 /admin/;
  }

  location /api/v1/auth/google {
    proxy_pass http://client/google;
  }

  location / {
    proxy_pass http://client;
  }
}
