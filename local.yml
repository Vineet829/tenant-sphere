

services:
  api:
    build:
      context: .
      dockerfile: ./docker/spring/Dockerfile
    image: tenant_spring_api
    container_name: tenant_spring_api
    volumes:
      - tenant_prod_media:/app/media
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ./.envs/.env.local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Local nginx serves plain HTTP; secure cookies would be dropped by the browser.
      COOKIE_SECURE: "false"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_AUTH: "false"
      EMAIL_USE_TLS: "false"
    depends_on:
      - postgres
      - mailpit
    networks:
      - tenant_prod_nw

  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    image: tenant_prod_postgres
    container_name: tenant_prod_postgres
    ports:
      - "5432:5432"
    volumes:
      - tenant_prod_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    networks:
      - tenant_prod_nw

  mailpit:
    image: docker.io/axllent/mailpit:v1.15
    container_name: tenant_prod_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - tenant_prod_mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - tenant_prod_nw

  client:
    build:
      context: ./client
      dockerfile: ./docker/local/Dockerfile
    container_name: tenant_client
    image: tenant_client
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    # add this line(uncomment it) so that hot module reloading can work when working with windows subsystem for linux.
    # environment:
    #   - WATCHPACK_POLLING=true
    networks:
      - tenant_prod_nw

  nginx:
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    restart: always
    container_name: tenant_nginx
    ports:
      - "8080:80"
    volumes:
      - logs_store:/var/log/nginx
    depends_on:
      - api
      - client
    networks:
      - tenant_prod_nw


networks:
  tenant_prod_nw:
    external: true

volumes:
  tenant_prod_postgres_data: {}
  tenant_prod_mailpit_data: {}
  tenant_prod_media: {}
  logs_store: {}
