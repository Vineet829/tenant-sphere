

services:
  api:
    build:
      context: .
      dockerfile: ./docker/spring/Dockerfile
    image: tenant_spring_api
    container_name: tenant_spring_api
    volumes:
      - tenant_prod_media:/app/media
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ./.envs/.env.local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Local nginx serves plain HTTP; secure cookies would be dropped by the browser.
      COOKIE_SECURE: "false"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_AUTH: "false"
      EMAIL_USE_TLS: "false"
    # Waits until PostgreSQL accepts connections: on a first start it is still
    # creating the database, and the API exits if it cannot connect.
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - tenant_prod_nw

  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    image: tenant_prod_postgres
    container_name: tenant_prod_postgres
    # Published on this machine only: the database, the mail viewer, which shows every activation
    # and reset link, and the site are not for the rest of the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tenant_prod_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tenant_prod_nw

  mailpit:
    image: docker.io/axllent/mailpit:v1.15
    container_name: tenant_prod_mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - tenant_prod_mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - tenant_prod_nw

  client:
    build:
      context: ./client
      dockerfile: ./docker/local/Dockerfile
    container_name: tenant_client
    image: tenant_client
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    # add this line(uncomment it) so that hot module reloading can work when working with windows subsystem for linux.
    # environment:
    #   - WATCHPACK_POLLING=true
    networks:
      - tenant_prod_nw

  nginx:
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    restart: always
    container_name: tenant_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - logs_store:/var/log/nginx
    depends_on:
      - api
      - client
    networks:
      - tenant_prod_nw


networks:
  tenant_prod_nw: {}

volumes:
  tenant_prod_postgres_data: {}
  tenant_prod_mailpit_data: {}
  tenant_prod_media: {}
  logs_store: {}
