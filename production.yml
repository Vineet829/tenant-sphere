
services:
  api:
    build:
      context: .
      dockerfile: ./docker/spring/Dockerfile
    restart: unless-stopped
    volumes:
      - media:/app/media
    expose:
      - "8000"
    env_file:
      - ./.envs/.env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenant_prod_nw

  postgres:
    build:
      context: .
      dockerfile: ./docker/production/postgres/Dockerfile
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tenant_prod_nw

  client:
    build:
      context: ./client
      dockerfile: ./docker/production/Dockerfile
    restart: unless-stopped
    env_file:
      - "./client/.env.production"
    expose:
      - "3000"
    networks:
      - tenant_prod_nw

  nginx:
    build:
      context: ./docker/production/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - client
    networks:
      - tenant_prod_nw

networks:
  tenant_prod_nw:
    external: true

volumes:
  postgres_data:
  media:
